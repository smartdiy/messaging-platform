spring:
  application:
    name: messaging-platform
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=600s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,auditevents,loggers,threaddump,heapdump
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

# Tracing configuration
tracing:
  enabled: true
  exporter:
    type: jaeger # or zipkin, otlp
    jaeger:
      endpoint: http://jaeger:14268/api/traces
    zipkin:
      endpoint: http://zipkin:9411/api/v2/spans
  correlation:
    enabled: true
    header-name: X-Correlation-ID

# Audit configuration
audit:
  enabled: true
  directory: ./audit-logs
  retention-days: 90
  max-file-size: 100MB
  compress-old-files: true
  include-metadata: true

# Diagnostics
diagnostics:
  enabled: true
  collection-interval: 30s
  history-size: 1000
  alert-thresholds:
    error-rate: 0.05
    queue-size: 1000
    processing-time: 5000ms

# Alerting
alerting:
  enabled: true
  webhooks:
    - url: ${SLACK_WEBHOOK:}
      type: slack
    - url: ${TEAMS_WEBHOOK:}
      type: teams
  rules:
    - name: "High Error Rate"
      condition: "error_rate > 0.05"
      severity: "CRITICAL"
    - name: "Queue Backlog"
      condition: "queue_size > 1000"
      severity: "WARNING"
    - name: "Protocol Down"
      condition: "protocol_status == 'DOWN'"
      severity: "CRITICAL"        
# Inbound Protocols
inbound:
  file:
    enabled: true
    directory: ./inbound
  rest:
    enabled: true
    path: /api/v1/messages
  sftp:
    enabled: false
    host: localhost
    port: 22
    username: user
    password: pass
  jms:
    enabled: false
    connection-factory: jms/ConnectionFactory
    destination: inboundQueue

# Outbound Protocols
outbound:
  file:
    enabled: true
    directory: ./outbound
  rest:
    enabled: true
    endpoint: http://localhost:8080/api/receive
  email:
    enabled: false
    host: smtp.gmail.com
    port: 587

# Performance Tuning
messaging:
  pool:
    buffer-size: 1000
    processor-threads: 10
    timeout-ms: 5000
  monitoring:
    enabled: true
    stats-interval-seconds: 30
